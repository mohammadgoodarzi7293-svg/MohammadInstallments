plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mohammadgoudarzi.installments'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mohammadgoudarzi.installments'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.biometric:biometric:1.1.0'
}
