<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>مدیریت چک‌ها</title><style>
*{
    box-sizing:border-box;

html,body{

body{

button{

.header{

.summary{

.stat{

.searchBox{

.search{

.close{

label{

.row{

.actions2{

.actions2 button{

.save{

}

.cancel{

}

.info{
    margin-top:8px;
    padding:9px;
    border-radius:10px;
    background:#f8fafc;
    color:#64748b;

.numberSelect{
    display:flex;
    gap:6px;
}

.numberSelect .input{
    flex:1;
}

.pickNumber{
    width:105px;
    border-radius:10px;
    background:#e0f2fe;
    color:#075985;
    font-size:10px;
    font-weight:bold;
}

.checkBookSelect{

}

.toast{
    position:fixed;
    left:12px;
    right:12px;
    bottom:18px;
    z-index:200;
    display:none;
    padding:12px;
    border-radius:12px;
    background:#17202a;
    color:#fff;
    text-align:center;
    font-size:11px;
}

.toast.show{
    display:block;
}

@media(max-width:380px){

    .row{
        grid-template-columns:1fr;
    }

    .bookNumbers{
        grid-template-columns:repeat(3,1fr);
    }

    .pickNumber{
        width:90px;
    }
}
</style></head><body><header class="header"><h1>مدیریت چک‌ها</h1><p>

========================= --><div id="pickModal" class="modal"><div class="sheet"><div class="sheetTitle"><h2>
📒 انتخاب شماره چک
</h2><button
class="close"
onclick="closePick()">
×
</button>

</div><div id="pickList"></div></div></div><div id="toast" class="toast"></div><script>

/* =====================================================
   کلیدهای ذخیره‌سازی
===================================================== */

const CHECK_KEY =
"mohammad_checks_v2";

const BOOK_KEY =
"mohammad_checkbooks_v2";


/* =====================================================
   اطلاعات
===================================================== */

let checks=[];

let books=[];

let editId=null;


/* =====================================================
   تبدیل اعداد فارسی / عربی به انگلیسی
===================================================== */

function digits(value){

return String(value || "")
.replace(/[۰-۹]/g,function(d){

return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);

})
.replace(/[٠-٩]/g,function(d){

return "٠١٢٣٤٥٦٧٨٩".indexOf(d);

})
.replace(/[٬,]/g,"");

}


/* =====================================================
   عدد فارسی
===================================================== */

function fa(value){

return Number(value || 0)
.toLocaleString("fa-IR");

}


/* =====================================================
   نمایش Toast
===================================================== */

function toast(text){

const el=
document.getElementById("toast");

el.textContent=text;

el.classList.add("show");

clearTimeout(window.__toastTimer);

window.__toastTimer=
setTimeout(function(){

el.classList.remove("show");

},2500);

}


/* =====================================================
   امنیت نمایش متن
===================================================== */

function escapeHtml(value){

return String(value || "")
.replace(/[&<>"']/g,function(c){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[c];

});

}


/* =====================================================
   Premium
===================================================== */

function isPremium(){

try{

if(
window.AndroidBridge &&
typeof AndroidBridge.isPremium==="function"
){

return !!AndroidBridge.isPremium();

}

}catch(e){}

return false;

}


/* =====================================================
   محدودیت نسخه رایگان
===================================================== */

function canAdd(){

if(isPremium())
return true;

try{

if(
window.AndroidBridge &&
typeof AndroidBridge.canAddCheck==="function"
){

return !!AndroidBridge.canAddCheck(
checks.length
);

}

}catch(e){}

return checks.length<1;

}


/* =====================================================
   بارگذاری
===================================================== */

function load(){

try{

const old=
localStorage.getItem(
CHECK_KEY
);

if(old){

checks=
JSON.parse(old);

if(!Array.isArray(checks))
checks=[];

}

}catch(e){

checks=[];

}


try{

const old=
localStorage.getItem(
BOOK_KEY
);

if(old){

books=
JSON.parse(old);

if(!Array.isArray(books))
books=[];

}

}catch(e){

books=[];

}

render();

}


/* =====================================================
   ذخیره
===================================================== */

function persist(){

localStorage.setItem(
CHECK_KEY,
JSON.stringify(checks)
);

localStorage.setItem(
BOOK_KEY,
JSON.stringify(books)
);

render();

}


/* =====================================================
   باز کردن فرم ثبت
===================================================== */

function add(){

if(!canAdd()){

const limit=
document.getElementById("limit");

limit.classList.add("show");

limit.innerHTML=
"نسخه رایگان فقط <b>۱ چک</b> را پشتیبانی می‌کند. امکانات دیگر برنامه همچنان قابل استفاده هستند.";

return;

}

editId=null;

clearForm();

document.getElementById(
"modalTitle"
).textContent="ثبت چک";

document.getElementById(
"modal"
).classList.add("show");

}


/* =====================================================
   پاک کردن فرم
===================================================== */

function clearForm(){

[
"number",
"amount",
"date",
"payee",
"reason"
].forEach(function(id){

document.getElementById(id).value="";

});

document.getElementById(
"status"
).value="issued";

document.getElementById(
"selectedBookInfo"
).style.display="none";

document.getElementById(
"selectedBookInfo"
).textContent="";

updateWords();

}


/* =====================================================
   بستن فرم
===================================================== */

function closeModal(){

document.getElementById(
"modal"
).classList.remove("show");

editId=null;

}


/* =====================================================
   ویرایش
===================================================== */

function edit(id){

const c=
checks.find(function(x){

return String(x.id)===String(id);

});

if(!c)
return;

editId=id;

document.getElementById(
"modalTitle"
).textContent="ویرایش چک";

document.getElementById("number").value=
c.number || "";

document.getElementById("amount").value=
c.amount || "";

document.getElementById("date").value=
c.date || "";

document.getElementById("payee").value=
c.payee || "";

document.getElementById("reason").value=
c.reason || "";

document.getElementById("status").value=
c.status || "issued";

if(c.bookId){

const book=
books.find(function(b){

return String(b.id)===String(c.bookId);

});

if(book){

const info=
document.getElementById(
"selectedBookInfo"
);

info.style.display="block";

info.textContent=
"📒 دسته‌چک: "+
book.name+
" | شعبه: "+
(book.branch || "—");

}

}

updateWords();

document.getElementById(
"modal"
).classList.add("show");

}


/* =====================================================
   ذخیره چک
===================================================== */

function saveCheck(){

const number=
document.getElementById(
"number"
).value.trim();


const amount=
Number(
digits(
document.getElementById(
"amount"
).value
)
);


const date=
document.getElementById(
"date"
).value;


if(
!number ||
!amount ||
!date
){

alert(
"شماره چک، مبلغ و تاریخ سررسید الزامی است."
);

return;

}


/* جلوگیری از شماره تکراری */

const duplicate=
checks.some(function(c){

return String(c.number)===String(number) &&
String(c.id)!==String(editId);

});

if(duplicate){

alert(
"این شماره چک قبلاً ثبت شده است."
);

return;

}


const old=
editId
?checks.find(function(x){

return String(x.id)===String(editId);

})
:null;


const item={

id:
editId ||
Date.now().toString(),

number:number,

amount:amount,

date:date,

payee:
document.getElementById(
"payee"
).value.trim(),

reason:
document.getElementById(
"reason"
).value.trim(),

status:
document.getElementById(
"status"
).value,

bookId:
old?.bookId || null,

createdAt:
old?.createdAt || Date.now()

};


if(editId){

const index=
checks.findIndex(function(x){

return String(x.id)===String(editId);

});

if(index>=0)
checks[index]=item;

}else{

checks.unshift(item);

}


persist();

closeModal();

toast(
editId
?"چک با موفقیت ویرایش شد."
:"چک با موفقیت ثبت شد."
);

}


/* =====================================================
   حذف چک
===================================================== */

function removeCheck(id){

const c=
checks.find(function(x){

return String(x.id)===String(id);

});

if(!c)
return;

if(
confirm(
"چک شماره "+
c.number+
" حذف شود؟"
)
){

checks=
checks.filter(function(x){

return String(x.id)!==String(id);

});

persist();

toast(
"چک حذف شد."
);

}

}


/* =====================================================
   وضعیت
===================================================== */

function statusText(status){

const map={

issued:"پرداخت نشده",

cashed:"وصول شده",

returned:"برگشت خورده",

cancelled:"لغو شده"

};

return map[status] || "نامشخص";

}


/* =====================================================
   وضعیت سررسید
===================================================== */

function isOverdue(c){

if(c.status!=="issued")
return false;

if(!c.date)
return false;

const d=
new Date(
c.date+"T23:59:59"
);

return d.getTime()<Date.now();

}


/* =====================================================
   Render چک‌ها
===================================================== */

function render(){

let total=0;

let near=0;

const today=
new Date();

today.setHours(
0,0,0,0
);


checks.forEach(function(c){

total+=
Number(c.amount || 0);


if(
c.status==="issued" &&
c.date
){

const d=
new Date(
c.date+"T00:00:00"
);

const diff=
(d-today)/86400000;

if(
diff>=0 &&
diff<=7
){

near++;

}

}

});


document.getElementById(
"count"
).textContent=
fa(checks.length);


document.getElementById(
"total"
).textContent=
fa(total)+" ریال";


document.getElementById(
"near"
).textContent=
fa(near);


renderChecks();

renderBooks();

}


/* =====================================================
   نمایش لیست چک‌ها
===================================================== */

function renderChecks(){

/* =====================================================
   مبلغ به حروف
===================================================== */

const ones=[

"",

"یک",

"دو",

"سه",

"چهار",

"پنج",

"شش",

"هفت",

"هشت",

"نه",

"ده",

"یازده",

"دوازده",

"سیزده",

"چهارده",

"پانزده",

"شانزده",

"هفده",

"هجده",

"نوزده"

];


const tens=[

"",

"",

"بیست",

"سی",

"چهل",

"پنجاه",

"شصت",

"هفتاد",

"هشتاد",

"نود"

];


const hundreds=[

"",

"صد",

"دویست",

"سیصد",

"چهارصد",

"پانصد",

"ششصد",

"هفتصد",

"هشتصد",

"نهصد"

];


const scales=[

"",

"هزار",

"میلیون",

"میلیارد",

"تریلیون",

"کوادریلیون"

];


function tri(n){

let result=[];


if(
Math.floor(n/100)
){

result.push(
hundreds[
Math.floor(n/100)
]
);

}


n%=100;


if(n){

if(result.length)
result.push(" و ");


if(n<20){

result.push(
ones[n]
);

}else{

result.push(
tens[
Math.floor(n/10)
]
);

if(n%10){

result.push(
" و "+
ones[n%10]
);

}

}

}


return result.join("");

}


function amountToWords(number){

number=
Math.floor(
Number(number)||0
);


if(number===0)
return "صفر";


let result=[];

let i=0;


while(number>0){

const part=
number%1000;


if(part){

result.unshift(

tri(part)+
(
scales[i]
?
" "+scales[i]
:""
)

);

}


number=
Math.floor(
number/1000
);

i++;

}


return result.join(" و ");

}

/* =====================================================
   تولید دسته چک
===================================================== */

function generateBook(){

const name=
document.getElementById(
"bookName"
).value.trim();


const branch=
document.getElementById(
"bookBranch"
).value.trim();


const start=
Number(
digits(
document.getElementById(
"bookStart"
).value
)
);


const end=
Number(
digits(
document.getElementById(
"bookEnd"
).value
)
);


const prefix=
digits(
document.getElementById(
"bookPrefix"
).value
);


if(!name){

alert(
"نام بانک یا دسته‌چک را وارد کنید."
);

return;

}


if(
!start ||
!end ||
end<start
){

alert(
"شماره شروع و پایان صحیح وارد کنید."
);

return;

}


const count=
end-start+1;


/*
 * محدودیت مصنوعی ۱۰۰ برگ حذف شده است.
 * Premium بعداً در لایه Native کنترل خواهد شد.
 */

if(count>100000){

alert(
"تعداد برگ واردشده غیرمنطقی است."
);

return;

}


const numbers=[];


for(
let i=0;
i<count;
i++
){

numbers.push(
prefix+
String(start+i)
);

}


/* جلوگیری از دسته چک تکراری */

const duplicate=
books.some(function(b){

return (
b.prefix===prefix &&
b.start===start &&
b.end===end
);

});


if(duplicate){

alert(
"این دسته‌چک قبلاً ثبت شده است."
);

return;

}


books.push({

id:
Date.now().toString(),

name:name,

branch:branch,

start:start,

end:end,

count:count,

prefix:prefix,

numbers:numbers,

createdAt:Date.now()

});


persist();

closeBook();

toast(
"دسته‌چک با "+
fa(count)+
" برگ ساخته شد."
);

}
